      - name: Install System Deps
        run: sudo apt-get update && sudo apt-get install -y unzip curl

      - name: Run Scanner
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
        run: python main.py
