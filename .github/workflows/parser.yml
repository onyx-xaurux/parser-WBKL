
name: Proxy Parser

on:
  schedule:
    - cron: '0 */2 * * *'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: proxy-parser
  cancel-in-progress: false

jobs:
  parser:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
      BASE_PROXY: ${{ secrets.BASE_PROXY }}
      SING_BOX_PATH: sing-box

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.6'

      - name: Install sing-box
        run: |
          go install -tags "with_utls with_grpc with_quic" github.com/sagernet/sing-box/cmd/sing-box@v1.11.15
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Verify sing-box
        run: sing-box version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run parser
        run: python main.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for f in working_proxies.txt dead_cache.json; do
            if [ -f "$f" ]; then
              git add -- "$f"
            else
              echo "File not found: $f"
            fi
          done

          if ! git diff --cached --quiet; then
            git commit -m "Update proxy parser results"
            git push
          else
            echo "No changes to commit"
          fi
