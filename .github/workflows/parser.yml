name: Proxy Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *' # Каждые 6 часов

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch Whitelist
        run: python fetch_whitelist.py

      - name: Run Scanner
        run: python main.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in working_proxies.txt dead_cache.json; do
            [ -f "$f" ] && git add "$f" || echo "no $f"
          done
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "update results [skip ci]"
            git push
          fi
