
name: Proxy Scanner Parser

on:
  schedule:
    - cron: "0 */2 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: proxy-scanner
  cancel-in-progress: false

jobs:
  parser:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run parser
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
          DEAD_CACHE_TTL: "86400"
          LOG_LEVEL: "INFO"
        run: |
          python main.py

      - name: Upload parser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parser-results
          path: |
            parsed_results.json
            dead_cache.json
            working_proxies.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit results
        if: success() && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add parsed_results.json dead_cache.json working_proxies.txt

          if ! git diff --cached --quiet; then
            git commit -m "Update parser results [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi
